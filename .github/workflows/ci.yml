name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Bun's version comes from "packageManager" in the root package.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # tsdown needs Node ^22.18 || ^24.11 || >=26, and pipelines' tests/package
      # runs its runtime checks in Node, as consumers would.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      # Runs both suites with coverage, enforces 100% per package and writes
      # packages/<name>/coverage/lcov.repo.info with repo-relative paths.
      - name: Test with coverage
        run: bun run test:coverage

      - name: Check pipelines as consumers see it
        run: bun run test:package

      - name: Build
        run: bun run build

      - name: Check bundle size
        run: bun run size

      # Last, so a Codecov outage (fail_ci_if_error) can't hide the checks above.
      - name: Upload pipelines coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/pipelines/coverage/lcov.repo.info
          disable_search: true
          flags: pipelines
          fail_ci_if_error: true

      - name: Upload use-form coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/use-form/coverage/lcov.repo.info
          disable_search: true
          flags: use-form
          fail_ci_if_error: true

  # use-form must keep working with the lowest pipelines version its peer range
  # accepts, installed from npm rather than linked from the workspace. When that
  # version is the workspace's own (right after a pipelines minor), the checks job
  # already tests it, so this job skips its checks.
  use-form-min-pipelines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find the lowest supported pipelines
        id: lowest
        run: bun scripts/lowest-pipelines.ts >> "$GITHUB_OUTPUT"

      - name: Install the lowest supported pipelines from npm
        if: steps.lowest.outputs.older == 'true'
        working-directory: packages/use-form
        env:
          MIN: ${{ steps.lowest.outputs.version }}
        run: |
          bun add -d "@railway-ts/pipelines@$MIN"
          INSTALLED=$(node -p "require('./node_modules/@railway-ts/pipelines/package.json').version")
          if [ "$INSTALLED" != "$MIN" ]; then echo "expected @railway-ts/pipelines $MIN, got $INSTALLED"; exit 1; fi

      - name: Type check use-form
        if: steps.lowest.outputs.older == 'true'
        working-directory: packages/use-form
        run: bun run typecheck

      - name: Test use-form
        if: steps.lowest.outputs.older == 'true'
        working-directory: packages/use-form
        run: bun test

  # Runs pipelines' runtime checks, including require() of the ESM build, on the
  # lowest Node that engines.node accepts. tsdown needs a newer Node to build, so
  # this builds on 26 and then switches. Keep node-version equal to engines.node.
  node-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node for the build
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build pipelines
        run: bun run build:deps

      - name: Setup the lowest supported Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Run pipelines' runtime checks
        run: node packages/pipelines/tests/package/runtime.mjs

  # Versions the packages as the release workflow would (without opening a pull
  # request) and checks their peer ranges against npm, so a change that would
  # break the release fails in its own PR instead of after the merge.
  release-plan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # check-peer-ranges compares against each package's latest release with npm.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The release workflow versions the packages only when changesets are pending
      # (`changeset version` exits 1 when there are none), so this does the same.
      - name: Version packages
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            bun run changeset version
          else
            echo "No pending changesets: nothing to version."
          fi

      # Runs with or without changesets: a PR that narrows a peer range without
      # one must fail too.
      - name: Check peer ranges
        run: bun scripts/check-peer-ranges.ts
