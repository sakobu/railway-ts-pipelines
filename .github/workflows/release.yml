name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version commit and tags, create Releases
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency: release

jobs:
  release:
    # Forks have no npm trusted publisher; don't try to release from them.
    if: github.repository == 'sakobu/railway-ts'
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs because this job can publish (id-token: write).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # npm trusted publishing needs npm >= 11.5.1; 0.2.0/0.1.34 were published with npm 12.
      - name: Update npm
        run: npm install -g npm@12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # With pending changesets: opens or updates the "Version Packages" PR
      # (ci:version). Once that PR is merged: runs bun run check, then packs and
      # publishes each new version with npm and tags it (ci:publish); the action
      # pushes the tags and creates the GitHub Releases. No npm token: npm trusts
      # this workflow via OIDC.
      #
      # The Version Packages PR is opened with github.token, so GitHub runs no CI
      # on it; check it locally (bun install --frozen-lockfile && bun run check).
      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run ci:version
          publish-script: bun run ci:publish
